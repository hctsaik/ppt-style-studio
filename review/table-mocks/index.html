<!doctype html><meta charset="utf-8"><title>table mocks</title>
<style>body{margin:0;font:13px "Noto Sans CJK TC",sans-serif;background:#F4F5F7;color:#333}#app{padding:14px 18px}
.top{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #E3E3E3;border-radius:8px;padding:8px 12px}.sp{flex:1}
button,select,input{font:inherit;padding:5px 10px;border:1px solid #D5D5D5;border-radius:6px;background:#fff}button.pri{background:#1F4E79;color:#fff;border-color:#1F4E79}
.paste.ok{color:#2E7D4F}.paste small{color:#888}.hint{color:#777;margin:10px 2px 6px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #E3E3E3;border-radius:8px;overflow:hidden}.card.on{outline:2px solid #1F4E79}
.th svg{display:block;width:100%;height:auto}.nm{padding:6px 10px;font-weight:600}.nm em{font-style:normal;color:#1F4E79;font-size:11px;margin-left:6px}
.bar{display:flex;gap:10px;align-items:center;margin-top:12px;background:#fff;border:1px solid #E3E3E3;border-radius:8px;padding:8px 12px}
.big{position:relative;background:#fff;margin-top:12px;border:1px solid #E3E3E3;border-radius:6px}.big svg{display:block;width:100%;height:auto}
.pop{position:absolute;background:#fff;border:1px solid #CCC;border-radius:8px;box-shadow:0 6px 20px #0002;padding:6px;display:flex;gap:6px;align-items:center;white-space:nowrap}.pop .on{background:#E8EEF5;border-color:#1F4E79}
.hl{position:absolute;outline:2px dashed #1F4E79;border-radius:3px}
.steps i{font-style:normal;padding:4px 10px;border-radius:12px;background:#EEE;margin-right:4px}.steps i.on{background:#1F4E79;color:#fff}
.cols{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:12px}.types{display:flex;flex-direction:column;gap:8px}.ty{background:#fff;border:1px solid #E3E3E3;border-radius:8px;padding:10px}.ty.on{outline:2px solid #1F4E79}.ty small{display:block;color:#888}
.form{background:#fff;border:1px solid #E3E3E3;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}.prev{background:#fff;border:1px solid #E3E3E3}.prev svg{display:block;width:100%;height:auto}
</style><div id="app"></div>
<script src="../../icons.js"></script><script src="../../deck.js"></script><script src="samples.js"></script><script src="mock.js"></script>
<script>render((location.hash||'#A').slice(1));</script>
