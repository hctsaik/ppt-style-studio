<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%231F4E79%22/%3E%3C/svg%3E">
<title>PPT Style Studio · 圖解元件客製工作室</title>
<style>
:root{--ink:#3A3A3A;--t2:#595959;--mu:#8C8C8C;--line:#E4E4E4;--fill:#F6F6F6;--p:#1F4E79}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);font:13px/1.5 "Microsoft JhengHei","微軟正黑體","Noto Sans TC","Noto Sans CJK TC","PingFang TC",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font-family:inherit;font-size:12.5px;color:var(--ink)}
header{flex:none;display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
header h1 i{width:10px;height:10px;border-radius:50%;background:var(--p);display:inline-block;transition:.2s}
header h1 small{font-size:12px;font-weight:400;color:var(--mu)}
header .sp{flex:1}
.btn{border:1px solid #D6D6D6;background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{border-color:#B5B5B5;background:#FAFAFA}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.btn.pri:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:wait}
.wrap{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:12px 14px 40px}
aside::-webkit-scrollbar,.thumbs::-webkit-scrollbar{width:8px;height:8px}aside::-webkit-scrollbar-thumb,.thumbs::-webkit-scrollbar-thumb{background:#DDD;border-radius:9px}
.cap{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:1.4px;margin:4px 0 8px}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.tpl{border:1px solid var(--line);border-radius:8px;padding:7px 8px;cursor:pointer;background:#fff;text-align:left;transition:.15s}
.tpl:hover{border-color:#C8C8C8}
.tpl.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.tpl b{display:flex;align-items:center;gap:5px;font-size:12.5px}
.tpl b em,.tpl b u{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.tpl b u{background:var(--a)}
.tpl span{display:block;font-size:10.5px;color:var(--mu)}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:10px 2px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px;user-select:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mu);border-bottom:1.5px solid var(--mu);transform:rotate(-45deg);transition:.15s;margin:0 3px}
details[open] summary:before{transform:rotate(45deg)}
summary .n{margin-left:auto;font-size:10.5px;font-weight:400;color:var(--p);background:#F1F4F8;border-radius:99px;padding:0 7px;display:none}
summary .n.on{display:inline-block}
.grp{padding:0 2px 12px}
.row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;min-height:30px;position:relative}
.row>label{color:var(--t2);font-size:12px}
.row.mod>label:after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--p);margin-left:5px;vertical-align:middle}
.row select{width:100%;padding:4px 6px;border:1px solid #DADADA;border-radius:6px;background:#fff;height:28px}
.rng{display:flex;align-items:center;gap:8px}
.rng input{flex:1;accent-color:var(--p)}
.rng output{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-size:12px}
.col{display:flex;align-items:center;gap:6px}
.col input[type=color]{width:30px;height:24px;border:1px solid #D6D6D6;border-radius:5px;padding:1px;background:#fff;cursor:pointer}
.col input[type=text]{width:74px;padding:3px 6px;border:1px solid #DADADA;border-radius:5px;font-family:Consolas,monospace;font-size:11.5px;text-transform:uppercase}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 8px}
.pal{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;height:22px;width:58px}
.pal:hover{border-color:#AAA}.pal i{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid #DADADA;background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11.5px}
.seg button.on{border-color:var(--p);color:var(--p);background:#F3F6FA;font-weight:700}
.tg{position:relative;width:34px;height:19px;flex:none}
.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;background:#D5D5D5;border-radius:99px;cursor:pointer;transition:.15s}
.tg span:before{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:.15s}
.tg input:checked+span{background:var(--p)}.tg input:checked+span:before{transform:translateX(15px)}
.hint{font-size:11px;color:var(--mu);line-height:1.5;margin:2px 0 6px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 22px 6px}
.bar h2{margin:0;font-size:15px}.bar h2 small{color:var(--mu);font-weight:400;font-size:12px;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.chips span{background:var(--fill);border-radius:5px;padding:2px 8px;font-size:11px;color:var(--t2)}
.chips span b{color:var(--mu);font-weight:600;margin-right:4px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 22px}
.slide{position:relative;aspect-ratio:16/9;max-width:100%;max-height:100%;height:100%;border:1px solid #E2E2E2;border-radius:4px;box-shadow:0 4px 18px #00000012;background:#fff;overflow:hidden}
.slide svg{display:block;width:100%;height:100%}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:1px solid #DDD;background:#fffd;cursor:pointer;opacity:0;transition:.15s}
.slide:hover .nav{opacity:1}.nav.l{left:8px}.nav.r{right:8px}
.foot{flex:none;padding:4px 22px 12px}
.status{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--mu);margin-bottom:6px}
.status .ok{color:#3C8D5A}.status .bad{color:#C0504D;cursor:help}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px}
.th{flex:none;width:150px;cursor:pointer;text-align:center}
.th div{aspect-ratio:16/9;border:1px solid #E3E3E3;border-radius:3px;overflow:hidden;background:#fff;transition:.15s}
.th div svg{display:block;width:100%;height:100%}
.th.on div{border-color:var(--p);box-shadow:0 0 0 2px var(--p)}
.th span{display:block;font-size:11px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th.on span{color:var(--p);font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;line-height:1.6;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:760px}
.toast b{color:#FFE08A}
.el{cursor:copy}.el .hit{fill:#2E75B6;fill-opacity:0;stroke:none;pointer-events:all}
.el:hover .hit{fill-opacity:.06;stroke:#2E75B6;stroke-width:1;stroke-dasharray:3 2}
.el.sel .hit{fill-opacity:.08;stroke:#2E75B6;stroke-width:1.6;stroke-dasharray:none}
.ebar{position:absolute;z-index:5;display:none;align-items:center;gap:4px;background:#fff;border:1px solid #D6D6D6;border-radius:8px;box-shadow:0 4px 14px #0000001f;padding:4px 5px;font-size:11.5px;white-space:nowrap}
.ebar.on{display:flex}.ebar b{font-weight:700;color:var(--ink);margin:0 4px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.ebar button{border:1px solid #DADADA;background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11.5px}
.ebar button:hover{border-color:#999}.ebar button.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}
.hint2{font-size:11px;color:#2E75B6;margin-left:auto}
.mine{margin-bottom:10px}
.mine .save{display:flex;gap:5px;margin-bottom:6px}
.mine .save input{flex:1;min-width:0;padding:5px 7px;border:1px solid #DADADA;border-radius:6px}
.mlist{display:flex;flex-direction:column;gap:4px}
.mi{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 6px}
.mi.on{border-color:var(--p);box-shadow:0 0 0 1px var(--p) inset}
.mi .dots{display:flex;gap:2px;flex:none}.mi .dots i{width:9px;height:9px;border-radius:50%}
.mi .nm{flex:1;min-width:0;font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.mi .nm small{display:block;font-weight:400;color:var(--mu);font-size:10px}
.mi button{border:none;background:none;color:var(--t2);cursor:pointer;padding:2px 4px;font-size:11px;border-radius:4px}
.mi button:hover{background:#F0F0F0;color:var(--ink)}
.mi button.ap{color:var(--p);font-weight:700}
.mempty{font-size:11px;color:var(--mu);padding:4px 2px}
.mfoot{display:flex;gap:6px;margin-top:6px}.mfoot button{flex:1}
.toast.on{opacity:1;transform:translateX(-50%)}
.fatal{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:99;padding:30px}
.fatal div{max-width:640px;border:1px solid #E4E4E4;border-left:5px solid #C0504D;border-radius:10px;padding:26px 30px;box-shadow:0 6px 24px #0000000f}
.fatal h2{margin:0 0 10px;font-size:20px;color:#C0504D}.fatal p{margin:8px 0;font-size:15px;line-height:1.7;color:#3A3A3A}.fatal small{color:#8C8C8C;font-size:12px}
</style></head><body>
<header>
 <h1><i id="dot"></i>PPT Style Studio <small>精緻圖解元件・客製工作室（背景永遠白色）</small></h1>
 <span class="sp"></span>
 <button class="btn" id="bReset" title="捨棄所有微調，回到目前範本的預設值">↺ 重設為範本</button>
 <button class="btn" id="bSave" title="把目前設定存成 JSON 檔">儲存設定 JSON</button>
 <button class="btn" id="bLoad" title="載入先前存的 JSON 設定">載入設定</button>
 <input type="file" id="fLoad" accept=".json,application/json" hidden>
 <button class="btn" id="bOne">下載本頁 .pptx</button>
 <button class="btn pri" id="bAll">下載整份 .pptx</button>
</header>
<div class="wrap">
 <aside id="panel">
  <div class="cap">範本</div>
  <div class="tpls" id="tpls"></div>
  <div class="cap">我的風格</div>
  <div class="mine" id="mine">
   <div class="save"><input id="mName" maxlength="24" placeholder="為目前設定命名，例如：部門月報"><button class="btn pri" id="mSave">＋ 儲存</button></div>
   <div class="mlist" id="mList"></div>
   <div class="mfoot"><button class="btn" id="mExportAll">匯出全部 JSON</button><button class="btn" id="mImport">匯入 JSON…</button></div>
   <input type="file" id="mFile" accept=".json,application/json" hidden multiple>
  </div>
  <div id="groups"></div>
 </aside>
 <main>
  <div class="bar"><h2 id="sTitle"></h2><div class="chips" id="chips"></div></div>
  <div class="stage"><div class="slide" id="big"></div></div>
  <div class="foot">
   <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="status" id="status" style="margin:0"></div><span class="hint2" id="elHint"></span></div>
   <div class="thumbs" id="thumbs"></div>
  </div>
 </main>
</div>
<div class="toast" id="toast"></div>
<script src="pptxgen.bundle.js"></script>
<script src="deck.js"></script>

function syncPanel(skip){
 const T=templateParams(S.base);const p=S.p;
 document.querySelectorAll('#groups [data-k]').forEach(el=>{if(el===skip)return;const k=el.dataset.k;
  if(el.type==='checkbox')el.checked=el.dataset.ui?!!S[k]:!!p[k];

 document.querySelectorAll('#groups [data-seg]').forEach(s=>{const k=s.dataset.seg;s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(p[k])));});
 document.querySelectorAll('#groups [data-grey]').forEach(b=>{const g=GREYS[+b.dataset.grey][1];b.classList.toggle('on',Object.keys(g).every(k=>p[k]===g[k]));});
 /* 修改標記 */
 document.querySelectorAll('#groups details').forEach(d=>{let n=0;d.querySelectorAll('.row[data-row]').forEach(r=>{const k=r.dataset.row;const m=k in T&&String(T[k])!==String(p[k]);r.classList.toggle('mod',m);if(m)n++;});
  const s=d.querySelector('summary .n');s.textContent=n+' 項已調整';s.classList.toggle('on',n>0);});
 /* 依情境停用 */
 const dis=(k,v)=>{const r=document.querySelector(`.row[data-row="${k}"]`);if(r){r.style.opacity=v?.4:1;r.style.pointerEvents=v?'none':'';}};
 ['shMode','shB','shO','shA','shDir','haloB','haloA','ring'].forEach(k=>dis(k,!p.sh));
 dis('A',!p.useA);dis('canvasColor',!p.canvas);dis('cardLW',!(p.card==='outline'||p.card==='top'||p.card==='head'));
 document.querySelectorAll('.tpl').forEach(b=>b.classList.toggle('on',b.dataset.id===S.base));
 document.documentElement.style.setProperty('--p','#'+p.P);
}

/* ================= 單一元件：選取、複製、下載 ================= */
let SEL=null;
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clearSel(){SEL=null;document.querySelectorAll('#big .el.sel').forEach(x=>x.classList.remove('sel'));const b=$('#ebar');if(b)b.classList.remove('on');}
function selectEl(gi){clearSel();const sl=model.slides[S.slide];const g=sl.groups[gi];if(!g)return;SEL={gi,key:sl.key,name:g.name};
 const el=document.querySelector(`#big .el[data-g="${gi}"]`);if(el)el.classList.add('sel');
 const bar=$('#ebar'),big=$('#big'),k=big.clientWidth/((model.W||D.W)*72);$('#eName').textContent=g.name;$('#eDim').textContent=`${(g.w*2.54).toFixed(1)}×${(g.h*2.54).toFixed(1)} cm`;bar.classList.add('on');
 let x=(g.x*72)*k,y=(g.y+g.h)*72*k+8;const bw=bar.offsetWidth,bh=bar.offsetHeight;
 if(y+bh>big.clientHeight-4)y=g.y*72*k-bh-8;x=Math.max(4,Math.min(x,big.clientWidth-bw-4));bar.style.left=x+'px';bar.style.top=Math.max(4,y)+'px';}
function svgToPng(svg,wpt,hpt,scale){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
 img.onload=()=>{try{const c=document.createElement('canvas');c.width=Math.round(wpt*4/3*scale);c.height=Math.round(hpt*4/3*scale);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('PNG 轉換失敗')),'image/png');}catch(err){rej(err);}};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('SVG 無法繪製'));};img.src=url;});}
function elFiles(){const sl=model.slides[S.slide];const gi=SEL.gi;
 const vec=D.elementSvg(sl,gi,{flat:true,bg:false,pad:3,id:'v'});        // 剪貼簿／下載用：無濾鏡、箭頭實體化、透明背景
 const look=D.elementSvg(sl,gi,{flat:false,bg:false,pad:4,id:'l'});      // PNG 用：含柔和陰影
 return{vec,look,png:()=>svgToPng(look.svg,look.w,look.h,3)};}
const safeName=t=>String(t).replace(/[\\/:*?"<>|\s]+/g,'_');
async function elAction(a){if(!SEL)return;const f=elFiles();const base=fileBase()+'-'+SEL.key+'-'+safeName(SEL.name);
 if(a==='x'){clearSel();return;}
 if(a==='svg'){saveBlob(new Blob([f.vec.svg],{type:'image/svg+xml'}),base+'.svg');toast('已下載 SVG：PowerPoint「插入 › 圖片」後，右鍵「轉換成圖案」即可編輯。');return;}
 if(a==='png'){try{saveBlob(await f.png(),base+'.png');toast('已下載 PNG（含陰影的圖片，不可編輯）。');}catch(err){toast('PNG 產生失敗：'+err.message);}return;}
 if(a==='pptx'){try{const r=await D.exportElement({PptxGenJS:window.PptxGenJS,JSZip:window.JSZip},S.p,SEL.key,SEL.gi);saveBlob(r.data,base+'.pptx');
   window.__studio.lastElement={name:SEL.name,items:r.model.slides[0].items.length,patched:r.patched,size:r.data.size};
   toast(`已下載「${SEL.name}」單一元件 .pptx（${r.model.slides[0].items.length} 個原生圖形${r.model.slides[0].items.length>1?'、已群組':''}${r.patched?'、含柔和陰影':''}）。開啟後選取 → Ctrl+C → 貼到你的簡報。`,5000);}
  catch(err){console.error(err);toast('匯出失敗：'+err.message);}return;}
 if(a==='copy'){const r=await copyEl(f);window.__studio.lastCopy=r;}}
async function copyEl(f){const name=SEL.name;
 const fail=why=>{toast(`無法寫入剪貼簿（${why}）。請改用工具列的「<b>下載此元件 .pptx</b>」（原生可編輯）或「SVG／PNG」。`,6000,true);return{ok:false,why};};
 if(!window.isSecureContext)return fail('此頁不是安全來源');
 if(!navigator.clipboard||!navigator.clipboard.write||!window.ClipboardItem)return fail('瀏覽器不支援圖片剪貼簿');
 const svgOK=typeof ClipboardItem.supports==='function'&&ClipboardItem.supports('image/svg+xml');
 const data={'image/png':f.png()};if(svgOK)data['image/svg+xml']=new Blob([f.vec.svg],{type:'image/svg+xml'});
 try{await navigator.clipboard.write([new ClipboardItem(data)]);}
 catch(err){if(svgOK){try{await navigator.clipboard.write([new ClipboardItem({'image/png':f.png()})]);toast(`已複製「${escH(name)}」為 <b>PNG 圖片</b>（不可編輯）。要可編輯圖形請按「下載此元件 .pptx」。`,6000,true);return{ok:true,types:['image/png']};}catch(e2){return fail(e2.message||e2.name);}}
  return fail(err.message||err.name);}
 if(svgOK)toast(`已複製「${escH(name)}」（<b>SVG 向量＋PNG</b>）。PowerPoint 365／2019 以上：Ctrl+V 貼上 → 右鍵「<b>轉換成圖案</b>」即成可編輯圖形（陰影不會帶過去）。要 100% 原生圖形與陰影，請按「下載此元件 .pptx」。`,7000,true);
 else toast(`已複製「${escH(name)}」為 <b>PNG 圖片</b>（此瀏覽器不支援 SVG 剪貼簿，貼上後不可編輯）。要可編輯圖形請按「下載此元件 .pptx」。`,6000,true);
 return{ok:true,types:Object.keys(data)};}

function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}
const fileBase=()=>'kit-'+S.base+(isModified()?'-custom':'');
async function download(one){
 const btn=one?$('#bOne'):$('#bAll');btn.disabled=true;const old=btn.textContent;btn.textContent='產生中…';
 try{const key=D.SLIDES[S.slide][0];
  const r=await D.exportPptx({PptxGenJS:window.PptxGenJS,JSZip:window.JSZip},S.p,one?{only:[key]}:{});
  saveBlob(r.data,fileBase()+(one?'-'+String(S.slide+1).padStart(2,'0')+'-'+key:'')+'.pptx');
  window.__studio.lastExport={slides:r.model.slides.length,patched:r.patched,size:r.data.size};
  toast(`已產生 ${r.model.slides.length} 頁 .pptx（${r.patched} 個形狀套用柔和陰影）`);}
 catch(err){console.error(err);toast('匯出失敗：'+err.message);}
 finally{btn.disabled=false;btn.textContent=old;}}
$('#bAll').onclick=()=>download(false);
$('#bOne').onclick=()=>download(true);
$('#bSave').onclick=()=>{const T=templateParams(S.base);const diff={};Object.keys(S.p).forEach(k=>{if(String(T[k])!==String(S.p[k]))diff[k]=S.p[k];});
 saveBlob(new Blob([JSON.stringify({app:'ppt-style-studio',version:4,base:S.base,changed:diff,params:S.p},null,1)],{type:'application/json'}),fileBase()+'.json');toast('設定已存成 JSON');};
$('#bLoad').onclick=()=>$('#fLoad').click();
$('#fLoad').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const j=JSON.parse(await f.text());if(j.type==='my-styles'){const n=importMine(j,f.name);toast(`已匯入 ${n} 個「我的風格」`);e.target.value='';return;}
  S.mine=null;const base=presetOf(j.base).id;S.base=base;S.p=Object.assign(templateParams(base),j.params||j.changed||{});syncPanel();schedule();toast('已載入設定：'+f.name);}
 catch(err){toast('無法讀取設定檔：'+err.message);}e.target.value='';};
$('#bReset').onclick=()=>{S.mine=null;S.p=templateParams(S.base);syncPanel();schedule();toast('已重設為「'+presetOf(S.base).zh+'」預設值');};

/* ================= 我的風格（localStorage） ================= */
const MKEY='ppt-studio-mystyles';
const loadMine=()=>{try{const a=JSON.parse(localStorage.getItem(MKEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}};
const storeMine=a=>{try{localStorage.setItem(MKEY,JSON.stringify(a));return true;}catch(e){toast('瀏覽器不允許儲存（localStorage 無法使用）：'+e.message,5000);return false;}};
function diffOf(base,p){const T=templateParams(base);const d={};Object.keys(p).forEach(k=>{if(String(T[k])!==String(p[k]))d[k]=p[k];});return d;}
function entryOf(name){const p=Object.assign({},S.p,{zh:name});return{app:'ppt-style-studio',version:4,name,base:S.base,saved:new Date().toISOString(),changed:diffOf(S.base,p),params:p};}
function uniqueName(n,list){let k=n,i=2;while(list.some(x=>x.name===k))k=n+' ('+(i++)+')';return k;}
function renderMine(){const a=loadMine();
 $('#mList').innerHTML=a.length?a.map((m,i)=>{const p=Object.assign(templateParams(presetOf(m.base).id),m.params||m.changed||{});
  return `<div class="mi${S.mine===m.name?' on':''}" data-i="${i}"><span class="dots"><i style="background:#${p.P}"></i><i style="background:#${p.useA?p.A:p.PT}"></i><i style="background:#${p.ink}"></i></span>
   <span class="nm" data-a="apply" title="套用">${escH(m.name)}<small>以「${escH(presetOf(m.base).zh)}」為基礎</small></span>
   <button class="ap" data-a="apply">套用</button><button data-a="ren">改名</button><button data-a="exp">匯出</button><button data-a="del">刪除</button></div>`;}).join('')
  :'<div class="mempty">還沒有自訂風格。調整好後在上方命名並按「＋ 儲存」。</div>';}
function applyMine(m){const base=presetOf(m.base).id;S.base=base;S.p=Object.assign(templateParams(base),m.params||m.changed||{});S.mine=m.name;syncPanel();schedule();renderMine();toast('已套用我的風格：'+m.name);}
function importMine(j,fname){const list=loadMine();let n=0;
 const items=j.type==='my-styles'?(j.styles||[]):[j];
 items.forEach(it=>{if(!it||!(it.params||it.changed))return;const base=presetOf(it.base).id;
  const nm0=String(it.name||(it.params&&it.params.zh)||String(fname||'匯入的風格').replace(/\.json$/i,'')).slice(0,24);
  const p0=Object.assign(templateParams(base),it.params||it.changed);p0.zh=nm0;const sig=JSON.stringify(diffOf(base,p0));
  if(list.some(x=>x.name===nm0&&x.base===base&&JSON.stringify(x.changed)===sig))return;   // 完全相同的就不重複匯入
  const name=uniqueName(nm0,list);
  const p=Object.assign(templateParams(base),it.params||it.changed);p.zh=name;
  list.push({app:'ppt-style-studio',version:4,name,base,saved:it.saved||new Date().toISOString(),changed:diffOf(base,p),params:p});n++;});
 if(n)storeMine(list);renderMine();return n;}
$('#mSave').onclick=()=>{const list=loadMine();let name=$('#mName').value.trim();if(!name)name='我的風格 '+(list.length+1);
 const ex=list.findIndex(x=>x.name===name);const e=entryOf(name);
 if(ex>=0){if(!confirm(`「${name}」已存在，要覆蓋嗎？`))return;list[ex]=e;}else list.push(e);
 if(!storeMine(list))return;S.mine=name;S.p.zh=name;$('#mName').value='';renderMine();schedule();toast('已儲存為我的風格：'+name);};
$('#mName').onkeydown=e=>{if(e.key==='Enter')$('#mSave').click();};
$('#mList').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const row=b.closest('.mi');const i=+row.dataset.i;const list=loadMine();const m=list[i];if(!m)return;
 const a=b.dataset.a;
 if(a==='apply')applyMine(m);
 else if(a==='ren'){const n=prompt('新名稱',m.name);if(!n||!n.trim()||n.trim()===m.name)return;const nn=uniqueName(n.trim().slice(0,24),list);
  if(S.mine===m.name){S.mine=nn;S.p.zh=nn;}m.name=nn;m.params=Object.assign({},m.params,{zh:nn});m.changed=Object.assign({},m.changed,{zh:nn});storeMine(list);renderMine();schedule();toast('已改名為：'+nn);}
 else if(a==='del'){if(!confirm(`刪除「${m.name}」？`))return;list.splice(i,1);storeMine(list);if(S.mine===m.name)S.mine=null;renderMine();schedule();toast('已刪除：'+m.name);}
 else if(a==='exp'){saveBlob(new Blob([JSON.stringify(m,null,1)],{type:'application/json'}),'我的風格-'+safeName(m.name)+'.json');toast('已匯出「'+m.name+'」（可分享給同事，用「匯入 JSON…」載入）');}};
$('#mExportAll').onclick=()=>{const list=loadMine();if(!list.length){toast('目前沒有「我的風格」可以匯出');return;}
 saveBlob(new Blob([JSON.stringify({app:'ppt-style-studio',version:4,type:'my-styles',exported:new Date().toISOString(),styles:list},null,1)],{type:'application/json'}),'我的風格-全部-'+list.length+'個.json');toast(`已匯出 ${list.length} 個我的風格`);};
$('#mImport').onclick=()=>$('#mFile').click();
$('#mFile').onchange=async e=>{let n=0;for(const f of e.target.files){try{n+=importMine(JSON.parse(await f.text()),f.name);}catch(err){toast('無法讀取 '+f.name+'：'+err.message,4000);}}
 if(n)toast(`已匯入 ${n} 個我的風格`);e.target.value='';};

buildTemplates();buildGroups();syncPanel();renderMine();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(render);
render();
window.__studioApi={S,render,syncPanel,templateParams};
})();
</script></body></html>
