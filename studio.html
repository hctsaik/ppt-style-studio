<title>PPT Style Studio · 圖解元件客製工作室</title>
<style>
:root{--ink:#3A3A3A;--t2:#595959;--mu:#8C8C8C;--line:#E4E4E4;--fill:#F6F6F6;--p:#1F4E79}

/* 改字（v9）：{ '<頁>:<群組>': { '<第幾個圖形>': {from 原文, to 新文字} } } */
function cleanLabels(o){const out={};if(!o||typeof o!=='object')return out;Object.keys(o).slice(0,200).forEach(k=>{if(!/^[\w-]+:\d+$/.test(k)||!o[k]||typeof o[k]!=='object')return;const L={};
 Object.keys(o[k]).slice(0,60).forEach(i=>{const v=o[k][i];if(/^\d+$/.test(i)&&v&&typeof v==='object'&&typeof v.to==='string')L[i]={from:typeof v.from==='string'?D.stripCtl(v.from).slice(0,400):null,to:D.stripCtl(v.to).slice(0,400)};});
 if(Object.keys(L).length)out[k]=L;});return out;}
try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.p&&presetOf(s.base)){S.base=presetOf(s.base).id;S.p=cleanP(s.p,S.base);S.slide=0;/* 每次開啟都先顯示 01 元件總表 */S.mine=s.mine?D.stripCtl(s.mine).slice(0,40):null;S.autoTone=s.autoTone!==false;S.tab=['slides','icons','table'].includes(s.tab)?s.tab:'slides';S.examples=!!s.examples;S.labels=cleanLabels(s.labels);}}catch(e){}
const persist=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify({base:S.base,p:S.p,slide:S.slide,autoTone:S.autoTone,mine:S.mine||null,tab:S.tab||'slides',examples:!!S.examples,labels:S.labels||{}}));}catch(e){}};

function parseCSV(s){const rows=[];let row=[],cell='',q=false,quoted=false;
 for(let i=0;i<s.length;i++){const ch=s[i];
  if(q){if(ch==='"'){if(s[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;continue;}
  if(ch==='"'&&cell.trim()===''){q=true;quoted=true;cell='';continue;}
  if(ch===','){row.push({v:cell,q:quoted});cell='';quoted=false;}else if(ch==='\n'){row.push({v:cell,q:quoted});rows.push(row);row=[];cell='';quoted=false;}else cell+=ch;}
 if(cell!==''||row.length){row.push({v:cell,q:quoted});rows.push(row);}
 const R=rows.filter(r=>r.some(c=>c.v.trim()!==''));if(R.length<2)return null;const n=R[0].length;if(n<2||R.some(r=>r.length!==n))return null;

 return R.map(r=>r.map(c=>c.v.trim()));}

 $('#cMin').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===CMP.minFont));

 catch(err){console.error(err);$('#cNote').textContent='版面預覽失敗：'+err.message;}}

 const rows=[];for(let i=g.from;i<=g.to&&rows.length<40;i++){const it=raw.items[i];if(!it.runs||!it.runs.length)continue;const orig=D.textOf(it);if(!orig.trim())continue;const ix=i-g.from;const L=cur[ix];
  rows.push({ix,orig,val:L&&L.from===orig?L.to:orig,name:it.name||'文字'});}
 LB={lk,gi:SEL.gi,rows};$('#lbName').textContent='改字：'+g.name;

 S.labels=S.labels||{};if(Object.keys(L).length)S.labels[LB.lk]=L;else delete S.labels[LB.lk];const gi=LB.gi,n=Object.keys(L).length;$('#lbEd').hidden=true;LB=null;render();persist();selectEl(gi);
