<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern"><test name="family"><string>Microsoft JhengHei</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft JhengHei Light</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>PMingLiU</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK TC</string></edit></match>
  <match target="pattern"><test name="family"><string>Noto Sans TC</string></test><edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK TC</string></edit></match>
</fontconfig>
