  <div class="cap">我的風格</div>
  <div class="mine" id="mine">
   <div class="save"><input id="mName" maxlength="24" placeholder="為目前設定命名，例如：部門月報"><button class="btn pri" id="mSave">＋ 儲存</button></div>
   <div class="mlist" id="mList"></div>
   <div class="mfoot"><button class="btn" id="mExportAll">匯出全部 JSON</button><button class="btn" id="mImport">匯入 JSON…</button></div>
   <input type="file" id="mFile" accept=".json,application/json" hidden multiple>
  </div>
  <div id="groups"></div>
 </aside>
 <main>
  <section class="view" id="vSlides">
  <div class="bar"><h2 id="sTitle"></h2><div class="chips" id="chips"></div></div>
  <div class="stage"><div class="slide" id="big"></div></div>
  <div class="foot">
   <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="status" id="status" style="margin:0"></div><span class="hint2" id="elHint"></span></div>
   <div class="thumbs" id="thumbs"></div>
  </div>
  </section>
  <section class="view" id="vIcons" hidden>
   <div class="ibar">
    <input type="search" id="iSearch" placeholder="搜尋（中英）：晶圓、機台、風險、chart…">
    <span><span class="lb">顏色</span><span class="seg" id="iColor" style="display:inline-flex"></span></span>
    <span><span class="lb">樣式</span><span class="seg" id="iVar" style="display:inline-flex"></span></span>
    <span><span class="lb">粗細</span><span class="seg" id="iWt" style="display:inline-flex"></span></span>
    <span class="sp" style="flex:1"></span>
    <span class="hint" id="iInfo" style="margin:0"></span>
    <button class="btn" id="iZip" title="目前顏色／樣式的全部圖示：透明 PNG（2×）＋ SVG">全部下載 ZIP</button>
   </div>
   <div class="igrid" id="iGrid"></div>
   <div class="ibar2" id="ibar2"><b id="iName"></b><small id="iDim" style="color:#8C8C8C;margin-right:4px"></small><button class="pri" data-a="copy" title="SVG 向量＋透明 PNG">複製</button><button data-a="svg">SVG</button><button data-a="png2">PNG 2×</button><button data-a="png4">PNG 4×</button><button data-a="pic" title="1 頁 .pptx：SVG 向量圖片（PNG 備援），PowerPoint 365 可右鍵「轉換成圖案」">.pptx 圖片</button><button data-a="shape" title="1 頁 .pptx：原生自訂圖案（填色外框），直接可改顏色">.pptx 圖案</button><button data-a="tray" title="加入待選素材（保留目前風格）">＋待選</button><button data-a="x">✕</button></div>
  </section>
  <section class="view" id="vTable" hidden>
   <div class="tv">
    <div class="tbar">
     <button class="btn" id="tPasteBtn" title="讀取剪貼簿（或直接在這一頁任何地方按 Ctrl+V）">📋 貼上 <kbd>Ctrl+V</kbd></button>
     <select id="tSample" class="btn" title="載入範例資料"><option value="">範例…</option><option value="fin">財務摘要（損益表）</option><option value="cmp">方案比較</option><option value="status">專案進度（狀態）</option><option value="kpi">KPI 表</option></select>
     <button class="btn" id="tEditBtn" aria-expanded="false">編輯資料</button>
     <span class="tauto" id="tAuto"></span>
     <button class="btn pri" id="tCopy" title="HTML 表格：在 PowerPoint 按 Ctrl+V 即成原生表格">複製到 PowerPoint</button>
     <button class="btn" id="tPptx" title="1 頁 .pptx：原生表格（每格可編輯）＋底板／強調框">下載 .pptx</button>
     <button class="btn" id="tTray" title="加入待選素材（保留目前風格與資料）">＋待選</button>
    </div>
    <div class="tedit" id="tEdit" hidden>
     <div class="tedit-l"><div class="hint" style="margin:0 0 4px">Tab 分隔文字（Excel 複製來的就是）；改這裡會保留強調與粗體設定。</div><textarea id="tIn" spellcheck="false"></textarea></div>
     <div class="tedit-r"><div class="tgrid" id="tGrid"></div><div class="tline"><button class="btn" data-g="r+">＋列</button><button class="btn" data-g="c+">＋欄</button><button class="btn" data-g="r-">－列</button><button class="btn" data-g="c-">－欄</button><button class="btn" id="tClear">清空</button></div></div>
    </div>
    <div class="tlooks" id="tLooks"></div>
    <div class="tstage"><div class="tprev" id="tPrev"></div><div class="tmenu" id="tMenu" hidden></div></div>
    <div class="tfoot">
     <label>標題<input type="text" id="tTitle" placeholder="可留白"></label>
     <label>單位<input type="text" id="tUnit" placeholder="例：單位：新台幣十億元"></label>
     <label class="wide">註腳<input type="text" id="tNote" placeholder="資料來源、附註（用 \n 換行）"></label>
     <details class="tadv" id="tAdv"><summary>進階</summary><div class="tadv-b">
      <div class="row"><label>密度</label><div class="seg" data-tb="tbDense"></div></div>
      <div class="row"><label>強調方式</label><div class="seg" data-tb="tbHiMode"></div></div>
      <div class="row"><label>強調顏色</label><div class="seg" data-tb="tbHiColor"></div></div>
      <div class="row"><label>狀態文字上色</label><label class="tg"><input type="checkbox" data-tbk="tbStatus"><span></span></label></div>
      <div class="row"><label>負數紅字</label><label class="tg"><input type="checkbox" data-tbk="tbNeg"><span></span></label></div>
      <div class="row"><label>第一列是表頭</label><div class="seg" id="tHead"><button data-v="auto">自動</button><button data-v="1">是</button><button data-v="0">否</button></div></div>
      <div class="hint">尺寸跟著左側「元件尺寸 S／M／L」；顏色、字型跟著左側風格；這些設定也會存進「我的風格」。</div></div></details>
     <span class="hint" id="tMsg" style="margin:0 0 0 auto"></span>
    </div>
   </div>
  </section>
 </main>

 SL.patterns=()=>{title('常見組合 Common Patterns','已排好、已連線的流程小組合：整組複製即可使用（純流程圖語意）');

     const ns=['步驟一','步驟二','步驟三'].map((t,i)=>{const xi=x+i*(w+g);const n=N(xi,yy,w,t,i===2?{strong:1}:{});badge(xi+w/2,yy-.3,bnum(i+1),{d:.26,size:9,nodot:1});return n;});
     link(ns[0],3,ns[1],1);link(ns[1],3,ns[2],1);}],

     const a=N(x,yy,.72,'檢查');const d=sym('dec',dx,dcy-dh/2,dw,dh,'通過？',{size:fs-1});link(a,3,d,1);

     const f=N(dx+dw/2-.37,y+1.26,.74,'修正');link(d,2,f,0);lab(dx+dw/2+.02,dcy+dh/2+.04,.3,'否',{align:'left'});}],
   ['例外退回路徑','Exception Return',(x,y)=>{const w=.74,g=(cw-3*w)/2,yy=y+.36,c=i=>x+i*(w+g)+w/2;
     const ns=['受理','審查','完成'].map((t,i)=>N(x+i*(w+g),yy,w,t,i===2?{strong:1}:{}));link(ns[0],3,ns[1],1);link(ns[1],3,ns[2],1);
     const ly=yy+nh+.42;link(ns[1],2,ns[0],2,{via:[[c(1),ly],[c(0),ly]],style:{c:AL,w:Math.max(1.25,st.cnW),dash:'sysDash',head:'triangle',hs:'med'}});
     lab(c(0),ly+.04,c(1)-c(0),'例外：退回補件',{color:ALd});}],
   ['審核迴圈','Approval Loop',(x,y)=>{const yy=y+.78,cy=yy+nh/2,dw=.74,dh=.6,dx=x+1.0,kw=.62;
     const a=N(x,yy,.8,'提出申請');const d=sym('dec',dx,cy-dh/2,dw,dh,'審核',{size:fs-1});link(a,3,d,1);
     const k=N(x+cw-kw,yy,kw,'核准',{strong:1});link(d,3,k,1);lab(dx+dw,cy-.24,x+cw-kw-dx-dw,'通過');
     const ly=y+.24;link(d,0,a,0,{via:[[dx+dw/2,ly],[x+.4,ly]]});lab(x+.42,ly-.22,dx+dw/2-x-.42,'退回修改後重送');}],
   ['泳道（雙道）','Swimlane',(x,y)=>{const lh2=.8,hw=.46,l1=y+.04,l2=l1+lh2+.06,c1=l1+lh2/2,c2=l2+lh2/2,w=.7;
     [[l1,'申\n請\n人'],[l2,'主\n管']].forEach(([ly,t])=>{box(x,ly,cw,lh2,{fill:'FFFFFF',line:G.l2,lw:.75,name:'泳道'});box(x,ly,hw,lh2,{fill:GF,text:t,size:8.5,bold:1,color:G.t2,margin:0,lsp:.95,name:'泳道標題'});});
     const xa=x+hw+.14,xb=xa+w+.3,xc=x+cw-w-.08;
     const a=N(xa,c1-nh/2,w,'填寫'),b=N(xb,c2-nh/2,w,'審核'),c=N(xc,c1-nh/2,w,'歸檔',{strong:1});
     link(a,3,b,0);link(b,3,c,2);}],
   ['平行分流／合流','Parallel Split / Merge',(x,y)=>{const ca=y+.38,cb=y+1.3,cm=(ca+cb)/2,bw=.07,w=.74;

     link(s0,3,sp,1);link([xs+.1+bw,ca],0,na,1);link([xs+.1+bw,cb],0,nb,1);   // 分流棒的上下分支不在連接點上：只黏終點
     link(na,3,[xj-.2,ca],0);link(nb,3,[xj-.2,cb],0);link(mg,3,e,1);}],
   ['輸入→處理→輸出','Input / Process / Output',(x,y)=>{const ww=[.82,.7,.82],g=(cw-ww[0]-ww[1]-ww[2])/2,yy=y+.5;let xi=x;

  combos.forEach(([zh,en,fn],i)=>{const col=i%NCOL,row=Math.floor(i/NCOL);const x=X0+col*(cw+GAPc),y=row?rows2:y0;
   const dx=mark(x,y+.14);txt(x+dx,y,cw-dx,.3,[{t:zh,s:LS(11.5),b:st.lBold,c:G.ink},{t:'  '+en,s:8,c:G.mute,f:nf}],{name:'組合名稱'});

 SL.patterns2=()=>{title('常見組合（二）Common Patterns II','分工表、前後對照、問題對策、方案比較、KPI 數字卡與 PDCA：整組複製即可使用');

function syncPanel(skip){

/* ================= 單一元件：選取、複製、下載 ================= */
let SEL=null;
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clearSel(){SEL=null;document.querySelectorAll('#big .el.sel').forEach(x=>x.classList.remove('sel'));const b=$('#ebar');if(b)b.classList.remove('on');}
function selectEl(gi){clearSel();const sl=model.slides[S.slide];const g=sl.groups[gi];if(!g)return;SEL={gi,key:sl.key,name:g.name};
 const el=document.querySelector(`#big .el[data-g="${gi}"]`);if(el)el.classList.add('sel');
 const bar=$('#ebar'),big=$('#big'),k=big.clientWidth/((model.W||D.W)*72);$('#eName').textContent=g.name;$('#eDim').textContent=`${(g.w*2.54).toFixed(1)}×${(g.h*2.54).toFixed(1)} cm`;bar.classList.add('on');
 let x=(g.x*72)*k,y=(g.y+g.h)*72*k+8;const bw=bar.offsetWidth,bh=bar.offsetHeight;
 if(y+bh>big.clientHeight-4)y=g.y*72*k-bh-8;x=Math.max(4,Math.min(x,big.clientWidth-bw-4));bar.style.left=x+'px';bar.style.top=Math.max(4,y)+'px';}
function svgToPng(svg,wpt,hpt,scale){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
 img.onload=()=>{try{const c=document.createElement('canvas');c.width=Math.round(wpt*4/3*scale);c.height=Math.round(hpt*4/3*scale);const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('PNG 轉換失敗')),'image/png');}catch(err){rej(err);}};
 img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('SVG 無法繪製'));};img.src=url;});}
function elFiles(){const sl=model.slides[S.slide];const gi=SEL.gi;
 const vec=D.elementSvg(sl,gi,{flat:true,bg:false,pad:3,id:'v'});        // 剪貼簿／下載用：無濾鏡、箭頭實體化、透明背景
 const look=D.elementSvg(sl,gi,{flat:false,bg:false,pad:4,id:'l'});      // PNG 用：含柔和陰影
 return{vec,look,png:()=>svgToPng(look.svg,look.w,look.h,3)};}
const safeName=t=>String(t).replace(/[\\/:*?"<>|\s]+/g,'_');

 if(a==='x'){clearSel();return;}
 if(a==='svg'){saveBlob(new Blob([f.vec.svg],{type:'image/svg+xml'}),base+'.svg');toast('已下載 SVG：PowerPoint「插入 › 圖片」後，右鍵「轉換成圖案」即可編輯。');return;}
 if(a==='png'){try{saveBlob(await f.png(),base+'.png');toast('已下載 PNG（含陰影的圖片，不可編輯）。');}catch(err){toast('PNG 產生失敗：'+err.message);}return;}
 if(a==='pptx'){try{const r=await D.exportElement({PptxGenJS:window.PptxGenJS,JSZip:window.JSZip},S.p,SEL.key,SEL.gi);saveBlob(r.data,base+'.pptx');
   window.__studio.lastElement={name:SEL.name,items:r.model.slides[0].items.length,patched:r.patched,size:r.data.size};
   toast(`已下載「${SEL.name}」單一元件 .pptx（${r.model.slides[0].items.length} 個原生圖形${r.model.slides[0].items.length>1?'、已群組':''}${r.patched?'、含柔和陰影':''}）。開啟後選取 → Ctrl+C → 貼到你的簡報。`,5000);}
  catch(err){console.error(err);toast('匯出失敗：'+err.message);}return;}
 if(a==='copy'){const r=await copyEl(f);window.__studio.lastCopy=r;}}
async function copyEl(f){const name=SEL.name;
 const fail=why=>{toast(`無法寫入剪貼簿（${why}）。請改用工具列的「<b>下載此元件 .pptx</b>」（原生可編輯）或「SVG／PNG」。`,6000,true);return{ok:false,why};};
 if(!window.isSecureContext)return fail('此頁不是安全來源');
 if(!navigator.clipboard||!navigator.clipboard.write||!window.ClipboardItem)return fail('瀏覽器不支援圖片剪貼簿');
 const svgOK=typeof ClipboardItem.supports==='function'&&ClipboardItem.supports('image/svg+xml');
 const data={'image/png':f.png()};if(svgOK)data['image/svg+xml']=new Blob([f.vec.svg],{type:'image/svg+xml'});

  return fail(err.message||err.name);}
 if(svgOK)toast(`已複製「${escH(name)}」（<b>SVG 向量＋PNG</b>）。PowerPoint 365／2019 以上：Ctrl+V 貼上 → 右鍵「<b>轉換成圖案</b>」即成可編輯圖形（陰影不會帶過去）。要 100% 原生圖形與陰影，請按「下載此元件 .pptx」。`,7000,true);
 else toast(`已複製「${escH(name)}」為 <b>PNG 圖片</b>（此瀏覽器不支援 SVG 剪貼簿，貼上後不可編輯）。要可編輯圖形請按「下載此元件 .pptx」。`,6000,true);
 return{ok:true,types:Object.keys(data)};}

  saveBlob(r.data,fileBase()+(one?'-'+String(S.slide+1).padStart(2,'0')+'-'+key:'')+'.pptx');

  toast(`已產生 ${r.model.slides.length} 頁 .pptx（${r.patched} 個形狀套用柔和陰影）`);}

const MKEY='ppt-studio-mystyles';

function diffOf(base,p){const T=templateParams(base);const d={};Object.keys(p).forEach(k=>{if(String(T[k])!==String(p[k]))d[k]=p[k];});return d;}
function entryOf(name){const p=Object.assign({},S.p,{zh:name});return{app:'ppt-style-studio',version:4,name,base:S.base,saved:new Date().toISOString(),changed:diffOf(S.base,p),params:p};}
function uniqueName(n,list){let k=n,i=2;while(list.some(x=>x.name===k))k=n+' ('+(i++)+')';return k;}
function renderMine(){const a=loadMine();
 $('#mList').innerHTML=a.length?a.map((m,i)=>{const p=Object.assign(templateParams(presetOf(m.base).id),m.params||m.changed||{});
  return `<div class="mi${S.mine===m.name?' on':''}" data-i="${i}"><span class="dots"><i style="background:#${p.P}"></i><i style="background:#${p.useA?p.A:p.PT}"></i><i style="background:#${p.ink}"></i></span>
   <span class="nm" data-a="apply" title="套用">${escH(m.name)}<small>以「${escH(presetOf(m.base).zh)}」為基礎</small></span>
   <button class="ap" data-a="apply">套用</button><button data-a="ren">改名</button><button data-a="exp">匯出</button><button data-a="del">刪除</button></div>`;}).join('')
  :'<div class="mempty">還沒有自訂風格。調整好後在上方命名並按「＋ 儲存」。</div>';}
function applyMine(m){const base=presetOf(m.base).id;S.base=base;S.p=Object.assign(templateParams(base),m.params||m.changed||{});S.mine=m.name;syncPanel();schedule();renderMine();toast('已套用我的風格：'+m.name);}
function importMine(j,fname){const list=loadMine();let n=0;
 const items=j.type==='my-styles'?(j.styles||[]):[j];
 items.forEach(it=>{if(!it||!(it.params||it.changed))return;const base=presetOf(it.base).id;
  const nm0=String(it.name||(it.params&&it.params.zh)||String(fname||'匯入的風格').replace(/\.json$/i,'')).slice(0,24);
  const p0=Object.assign(templateParams(base),it.params||it.changed);p0.zh=nm0;const sig=JSON.stringify(diffOf(base,p0));
  if(list.some(x=>x.name===nm0&&x.base===base&&JSON.stringify(x.changed)===sig))return;   // 完全相同的就不重複匯入
  const name=uniqueName(nm0,list);
  const p=Object.assign(templateParams(base),it.params||it.changed);p.zh=name;
  list.push({app:'ppt-style-studio',version:4,name,base,saved:it.saved||new Date().toISOString(),changed:diffOf(base,p),params:p});n++;});
 if(n)storeMine(list);renderMine();return n;}

 if(ex>=0){if(!confirm(`「${name}」已存在，要覆蓋嗎？`))return;list[ex]=e;}else list.push(e);

 $('#tGrid').addEventListener('paste',e=>{const td=e.target.closest('td');if(!td)return;const t=e.clipboardData.getData('text/plain');if(!/[\t\n]/.test(t))return;e.preventDefault();
  const r0=+td.dataset.r,c0=+td.dataset.c;parseTSV(t).forEach((row,i)=>row.forEach((v,j)=>{while(T.rows.length<=r0+i)T.rows.push([]);const R=T.rows[r0+i];while(R.length<=c0+j)R.push('');R[c0+j]=v;}));
  fixT();saveT();syncTableUI();renderTable();});
 $('#tEdit').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;const g=b.dataset.g,nC=Math.max(1,...T.rows.map(r=>r.length));
  if(g==='r+')T.rows.push(Array(nC).fill(''));if(g==='c+')T.rows.forEach(r=>r.push(''));if(g==='r-'&&T.rows.length>1)T.rows.pop();if(g==='c-'&&nC>1)T.rows.forEach(r=>r.length=Math.min(r.length,nC-1));
  fixT();saveT();syncTableUI();renderTable();});
 $('#tLooks').onclick=e=>{const b=e.target.closest('.tlook');if(!b)return;S.p.tbLook=b.dataset.v;schedule();};
 // 預覽上的點選：表頭＝欄；第一欄＝列；其他格＝欄與列
 const ov=()=>$('#tPrev .tov');
 $('#tPrev').addEventListener('mouseover',e=>{const c=e.target.closest('.tov i');if(!c||!ov())return;const r=+c.dataset.r,k=+c.dataset.c,h0=TM&&TM.slides[0].table?TM.slides[0].table.h0:1;
  ov().querySelectorAll('i').forEach(x=>x.classList.toggle('h',r<h0?+x.dataset.c===k:k===0?+x.dataset.r===r:(+x.dataset.r===r&&+x.dataset.c===k)));});
 $('#tPrev').addEventListener('mouseleave',()=>{if(ov())ov().querySelectorAll('i.h').forEach(x=>x.classList.remove('h'));});
 $('#tPrev').addEventListener('click',e=>{const c=e.target.closest('.tov i');if(!c){closeTMenu();return;}e.stopPropagation();openTMenu(+c.dataset.r,+c.dataset.c,c);});
 $('#tMenu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation();const a=b.dataset.a,i=+b.dataset.i;
  if(a==='hiC'||a==='hiR'){const ty=a==='hiC'?'col':'row';T.hi=T.hi&&T.hi.type===ty&&T.hi.i===i?{type:'none'}:{type:ty,i};}
  if(a==='bold'){const s2=new Set(T.bold||[]);s2.has(i)?s2.delete(i):s2.add(i);T.bold=[...s2].sort((x,y)=>x-y);}
  if(a==='al'){T.align=Object.assign({},T.align);if(T.align[i]===b.dataset.v)delete T.align[i];else T.align[i]=b.dataset.v;}
  if(a==='clr')T.hi={type:'none'};
  if(a==='x'){closeTMenu();return;}
  saveT();renderTable(true);if(TMENU)openTMenu(TMENU.r,TMENU.c);});
 document.addEventListener('click',e=>{if(!e.target.closest('#tMenu')&&!e.target.closest('.tov'))closeTMenu();if(!e.target.closest('#tAdv'))$('#tAdv').open=false;});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTMenu();});
 $('#tCopy').onclick=copyTable;$('#tPptx').onclick=downloadTable;$('#tTray').onclick=()=>{if(!T.rows.length)return;addTray({kind:'table',table:clone(T),name:T.title||'表格'});};
 $('#tPrev').ondblclick=e=>{if(T.rows.length)$('#tTray').click();};}
let TMENU=null;
function closeTMenu(){TMENU=null;$('#tMenu').hidden=true;}
function openTMenu(r,c,cellEl){const tb=TM&&TM.slides[0].table;if(!tb)return;TMENU={r,c};const h0=tb.h0,rows=T.rows;
 const colName=(h0?rows[0][c]:'')||`第 ${c+1} 欄`,rowName=rows[r]&&rows[r][0]||`第 ${r+1} 列`;
 const hiC=T.hi&&T.hi.type==='col'&&T.hi.i===c,hiR=T.hi&&T.hi.type==='row'&&T.hi.i===r,isB=(T.bold||[]).includes(r);
 const auto=c===0?'left':tb.colNum[c]?'right':'left';const al=(T.align||{})[c]||'';
 const colPart=`<div class="mh">欄：<b>${escH(colName.slice(0,16))}</b></div><div class="mr"><button data-a="hiC" data-i="${c}" class="${hiC?'on':''}">★ 強調此欄</button><span class="seg" style="display:inline-flex">${[['left','左'],['center','中'],['right','右']].map(([v,z])=>`<button data-a="al" data-i="${c}" data-v="${v}" class="${(al||auto)===v?'on':''}">${z}</button>`).join('')}</span></div>`;
 const rowPart=`<div class="mh">列：<b>${escH(rowName.slice(0,16))}</b></div><div class="mr"><button data-a="hiR" data-i="${r}" class="${hiR?'on':''}">★ 強調此列</button><button data-a="bold" data-i="${r}" class="${isB?'on':''}"><b>B</b> 粗體</button></div>`;
 const parts=r<h0?[colPart]:c===0?[rowPart]:[colPart,rowPart];
 const m=$('#tMenu');m.innerHTML=parts.join('<hr>')+(T.hi&&T.hi.type!=='none'?`<hr><div class="mr"><button data-a="clr">清除強調</button><button data-a="x" style="margin-left:auto">✕</button></div>`:`<div class="mr" style="justify-content:flex-end"><button data-a="x">✕</button></div>`);m.hidden=false;
 const st=$('.tstage').getBoundingClientRect();const el=cellEl||$(`#tPrev .tov i[data-r="${r}"][data-c="${c}"]`);if(!el)return;const cr=el.getBoundingClientRect();
 let x=cr.left-st.left,y=cr.bottom-st.top+6;if(y+m.offsetHeight>st.height-4)y=cr.top-st.top-m.offsetHeight-6;x=Math.max(4,Math.min(x,st.width-m.offsetWidth-4));m.style.left=x+'px';m.style.top=y+'px';}
function fixT(){const nC=Math.max(0,...T.rows.map(r=>r.length));T.rows.forEach(r=>{while(r.length<nC)r.push('');});if(!T.hi)T.hi={type:'none'};
 if(T.hi.type==='col'&&T.hi.i>=nC)T.hi={type:'none'};if(T.hi.type==='row'&&T.hi.i>=T.rows.length)T.hi={type:'none'};if(Array.isArray(T.bold))T.bold=T.bold.filter(r=>r<T.rows.length);}
function renderGrid(){$('#tGrid').innerHTML='<table>'+T.rows.map((r,i)=>'<tr>'+r.map((c,j)=>`<td contenteditable="true" data-r="${i}" data-c="${j}">${escH(c)}</td>`).join('')+'</tr>').join('')+'</table>';}
function syncTableUI(){fixT();$('#tIn').value=toTSV(T.rows);$('#tTitle').value=T.title||'';$('#tUnit').value=T.unit||'';$('#tNote').value=(T.note||'').replace(/\n/g,'\\n');if(!$('#tEdit').hidden)renderGrid();renderTableOpts();}
function renderTableOpts(){
 document.querySelectorAll('[data-tb]').forEach(el=>el.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(S.p[el.dataset.tb]||TB_OPTS[el.dataset.tb][0][0]))));
 document.querySelectorAll('[data-tbk]').forEach(el=>{el.checked=S.p[el.dataset.tbk]!==false&&(el.dataset.tbk==='tbStatus'||!!S.p[el.dataset.tbk]);});
 const hv=T.header==null||T.header==='auto'?'auto':T.header?'1':'0';$('#tHead').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===hv));}
const lookOf=p=>D.TABLE_LOOKS.some(l=>l[0]===p.tbLook)?p.tbLook:(p.tbPanel?'panel':'clean');
let TM=null,TLKEY='';
function cropSvg(sl,id,pad){const b={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9};sl.items.forEach(it=>{if(it.t==='ln')return;b.x0=Math.min(b.x0,it.x);b.y0=Math.min(b.y0,it.y);b.x1=Math.max(b.x1,it.x+it.w);b.y1=Math.max(b.y1,it.y+it.h);});
 pad=pad||.12;return D.toSvg({items:sl.items},{id,flat:true,viewBox:`${((b.x0-pad)*72).toFixed(1)} ${((b.y0-pad)*72).toFixed(1)} ${((b.x1-b.x0+2*pad)*72).toFixed(1)} ${((b.y1-b.y0+2*pad)*72).toFixed(1)}`});}
function renderLooks(){const key=JSON.stringify([T.rows,T.hi,T.bold,T.align,T.header,T.title,S.p]);if(key===TLKEY)return;TLKEY=key;
 const cur=lookOf(S.p);const Tl=Object.assign({},T,{title:'',unit:'',note:'',rows:T.rows.slice(0,7)});
 $('#tLooks').innerHTML=D.TABLE_LOOKS.map(([k,zh])=>{let s='';try{const m=D.buildModel(Object.assign({},S.p,{tbLook:k,size:'M'}),{table:Tl});s=cropSvg(m.slides[0],'lk'+k,.1);}catch(e){}
  return `<button class="tlook${k===cur?' on':''}" data-v="${k}" title="外觀：${zh}"><span class="th">${s}</span><span class="nm">${zh}</span></button>`;}).join('');}
function renderTable(light){renderTableOpts();const nR=T.rows.length,nC=Math.max(0,...T.rows.map(r=>r.length));
 if(!nR){TM=null;closeTMenu();$('#tLooks').innerHTML='';TLKEY='';$('#tAuto').innerHTML='';
  $('#tPrev').innerHTML=`<div class="tempty"><b>在這一頁按 Ctrl+V 貼上 Excel 表格</b><span>從 Excel／Google 試算表選取儲存格 → Ctrl+C → 回到這裡 Ctrl+V（不用點任何框）</span><div class="tline">${[['fin','財務摘要'],['cmp','方案比較'],['status','專案進度'],['kpi','KPI 表']].map(([k,z])=>`<button class="btn" data-sample="${k}">範例：${z}</button>`).join('')}</div></div>`;
  $('#tPrev').querySelectorAll('[data-sample]').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#tSample').value=b.dataset.sample;$('#tSample').onchange({target:$('#tSample')});});
  $('#tMsg').textContent='';window.__studio.table={rows:0,cols:0};return;}
 TM=D.buildModel(S.p,{table:T});const sl=TM.slides[0],tb=sl.table;
 const W=D.W,H=D.H,pc=(v,t)=>(v/t*100).toFixed(3)+'%';let ov='';
 if(tb){let y=tb.ty;tb.rowH.forEach((h,r)=>{let x=tb.tx;tb.colW.forEach((w,c)=>{ov+=`<i data-r="${r}" data-c="${c}" style="left:${pc(x,W)};top:${pc(y,H)};width:${pc(w,W)};height:${pc(h,H)}" title="${r<tb.h0?'點：這一欄':c===0?'點：這一列':'點：這一欄／列'}"></i>`;x+=w;});y+=h;});}
 $('#tPrev').innerHTML=D.toSvg(sl,{id:'tp'})+`<div class="tov">${ov}</div>`;
 const A=D.tableAuto(T.rows.map(r=>r.map(c=>String(c))));const nNum=A.numC.filter(Boolean).length,nSt=A.statC.filter(Boolean).length,nSec=A.section.filter(Boolean).length;
 const hd=T.header==null||T.header==='auto'?A.head:!!T.header;
 $('#tAuto').innerHTML=`<b>✓ 自動排版</b>${nR} 列 × ${nC} 欄・${hd?'第 1 列＝表頭':'無表頭'}${nNum?`・${nNum} 個數字欄靠右同寬`:''}${nSt?`・狀態欄上色`:''}${nSec?`・${nSec} 個小節列`:''}${(T.bold||[]).length?`・${T.bold.length} 列粗體`:''}`;
 if(!light)renderLooks();else{TLKEY='';clearTimeout(renderTable._t);renderTable._t=setTimeout(renderLooks,350);}
 $('#tLooks').querySelectorAll('.tlook').forEach(b=>b.classList.toggle('on',b.dataset.v===lookOf(S.p)));
 if(TMENU&&$('#tMenu').hidden===false){}
 $('#tMsg').textContent=(TM.warns.length?'⚠ '+TM.warns.map(w=>w.replace(/^\[[^\]]*\]\s*/,'')).join('；')+'　':'')+`點表格的欄／列可強調、粗體、對齊・元件尺寸 ${S.p.size||'M'}`;
 window.__studio.table={rows:nR,cols:nC,warns:TM.warns.length,look:lookOf(S.p),auto:{head:hd,num:nNum,status:nSt,section:nSec},hi:T.hi,cells:tb?tb.colW.length*tb.rowH.length:0};}
async function copyTable(){if(!TM)return;const html=D.tableHtml(TM),txt=toTSV(T.rows);window.__studio.lastTableHtml=html;
 try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]);window.__studio.lastTableCopy={ok:true};}
 catch(err){const d=document.createElement('div');d.contentEditable='true';d.innerHTML=html;d.style.cssText='position:fixed;left:-9999px';document.body.appendChild(d);
  const r=document.createRange();r.selectNodeContents(d);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);const ok=document.execCommand('copy');d.remove();window.__studio.lastTableCopy={ok,fallback:true};
  if(!ok){toast('瀏覽器不允許存取剪貼簿，請改用「下載 .pptx」。',5000);return;}}
 toast('已複製 → 到 PowerPoint 按 <b>Ctrl+V</b> 即成原生表格（顏色、粗體、框線、淡色強調都在）。'+(lookOf(S.p)==='panel'||lookOf(S.p)==='card'?'底板／外框只在「下載 .pptx」裡。':''),6000,true);}
async function downloadTable(){if(!TM)return;const b=$('#tPptx');b.disabled=true;
 try{const model=D.buildModel(S.p,{table:T});const r=await D.exportPptx(ENV(),S.p,{model});saveBlob(r.data,'table-'+S.base+'-'+safeName(T.title||'表格')+'.pptx');window.__studio.lastTablePptx={size:r.data.size};
  toast('已下載 .pptx：原生表格（每格可編輯）。',3500);}catch(err){console.error(err);toast('匯出失敗：'+err.message);}finally{b.disabled=false;}}

/* ================= 待選素材（每項＝加入當時的完整風格快照） ================= */
const TRKEY='ppt-studio-tray';
const loadTray=()=>{try{const a=JSON.parse(localStorage.getItem(TRKEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}};
const storeTray=a=>{try{localStorage.setItem(TRKEY,JSON.stringify(a));return true;}catch(e){toast('無法儲存待選素材（瀏覽器空間不足）：'+e.message,5000);return false;}};
let trayN=0;
function trayThumb(e){const id='tr'+(++trayN)+Date.now().toString(36);
 try{if(e.kind==='icon')return I.svg(e.icon.id,Object.assign({variant:e.icon.variant},(()=>{const L=iconLook(e.params);return{wt:L.wt,fg:L.fg,bg:L.bg};})()));
  const m=D.trayModel([e]);const sl=m.slides[0];const g=sl.groups[0];const pad=6;
  return D.toSvg({items:sl.items},{id,flat:true,bg:false,viewBox:`${(g.x*72-pad).toFixed(1)} ${(g.y*72-pad).toFixed(1)} ${(g.w*72+2*pad).toFixed(1)} ${(g.h*72+2*pad).toFixed(1)}`});}
 catch(err){return '';}}
function styleLabel(){return(S.mine||presetOf(S.base).zh)+(isModified()&&!S.mine?'（微調）':'')+'・'+(S.p.size||'M');}
function addTray(it){const e=Object.assign({uid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),params:clone(S.p),style:styleLabel(),added:new Date().toISOString()},it);
 e.thumb=trayThumb(e);const a=loadTray();a.push(e);if(!storeTray(a))return;renderTray();
 const btn=$('#trayBtn');btn.classList.remove('bump');void btn.offsetWidth;btn.classList.add('bump');
 toast(`已加入待選素材：<b>${escH(e.name)}</b>（${escH(e.style)}）・共 ${a.length} 項`,2600,true);window.__studio.trayCount=a.length;}
function renderTray(){const a=loadTray();$('#trayN').textContent=a.length;
 $('#trayList').innerHTML=a.length?a.map((e,i)=>`<div class="tri" draggable="true" data-i="${i}"><div class="tn">${e.thumb||''}</div><div class="tt"><i style="background:#${(e.params||{}).P||'999'}"></i>${escH(e.name)}<small>${escH(e.style||'')}｜${{el:'元件',icon:'圖示',table:'表格'}[e.kind]||''}</small></div><button data-a="up" title="上移">↑</button><button data-a="dn" title="下移">↓</button><button data-a="rm" title="移除">✕</button></div>`).join('')
  :'<div class="tempty">還沒有素材。<br>在投影片的任何元件、圖示庫的圖示、或表格預覽上<b>雙擊</b>，就會加入這裡（保留當時的風格）。</div>';
 $('#trayPptx').disabled=!a.length;$('#trayClear').disabled=!a.length;window.__studio.trayCount=a.length;}
$('#trayBtn').onclick=()=>{$('#tray').hidden=!$('#tray').hidden;if(!$('#tray').hidden)renderTray();};
$('#trayClose').onclick=()=>{$('#tray').hidden=true;};
$('#trayList').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b)return;const i=+b.closest('.tri').dataset.i;const a=loadTray();
 if(b.dataset.a==='rm')a.splice(i,1);else{const j=b.dataset.a==='up'?i-1:i+1;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];}storeTray(a);renderTray();};
let dragI=-1;
$('#trayList').addEventListener('dragstart',e=>{const r=e.target.closest('.tri');if(!r)return;dragI=+r.dataset.i;r.classList.add('drag');e.dataTransfer.effectAllowed='move';});
$('#trayList').addEventListener('dragover',e=>{const r=e.target.closest('.tri');if(!r)return;e.preventDefault();document.querySelectorAll('.tri.over').forEach(x=>x.classList.remove('over'));r.classList.add('over');});
$('#trayList').addEventListener('drop',e=>{const r=e.target.closest('.tri');if(!r||dragI<0)return;e.preventDefault();const j=+r.dataset.i;const a=loadTray();const [m]=a.splice(dragI,1);a.splice(j,0,m);dragI=-1;storeTray(a);renderTray();});
$('#trayList').addEventListener('dragend',()=>{dragI=-1;document.querySelectorAll('.tri').forEach(x=>x.classList.remove('drag','over'));});
$('#trayClear').onclick=()=>{if(!confirm('清除全部待選素材？'))return;storeTray([]);renderTray();};
$('#trayPptx').onclick=async()=>{const a=loadTray();if(!a.length)return;const b=$('#trayPptx');b.disabled=true;const old=b.textContent;b.textContent='產生中…';
 try{const model=D.trayModel(a);const r=await D.exportPptx(ENV(),a[0].params,{model});saveBlob(r.data,`待選素材-一頁-${a.length}項.pptx`);
  window.__studio.lastTray={n:model.tray.n,scale:model.tray.scale,skipped:model.tray.skipped.length,size:r.data.size,connectors:r.model.connectors};
  toast(`已下載一頁 .pptx：${model.tray.n} 項素材${model.tray.scale<1?`（整體縮放 ×${model.tray.scale} 才放得下）`:''}，各自保留加入時的風格，原生可編輯${model.tray.skipped.length?`；${model.tray.skipped.length} 項無法重建已略過`:''}。`,5000);}
 catch(err){console.error(err);toast('匯出失敗：'+err.message);}finally{b.disabled=false;b.textContent=old;}};
$('#big').addEventListener('dblclick',e=>{const g=e.target.closest('.el');if(!g)return;const sl=model.slides[S.slide];const gi=+g.dataset.g;const gr=sl.groups[gi];if(!gr)return;
 addTray({kind:'el',key:sl.key,gi,name:gr.name});});

buildIconBar();buildTableUI();renderTray();

buildTemplates();buildGroups();syncPanel();renderMine();setTab(S.tab||'slides');
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(render);
render();
window.__studioApi={S,render,syncPanel,templateParams};
})();
</script></body></html>
